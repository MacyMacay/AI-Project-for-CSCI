[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-csci"
version = "0.1.0"
description = "A small AI project for CSCI using graph search and pathfinding."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AI Project Team" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
